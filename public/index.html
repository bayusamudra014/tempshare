<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>TempShare</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>TempShare</h1>
  <p>Upload a file (max 10 MB). It is deleted after 24 hours.</p>
  <input type='file' id='file'>
  <button id='send'>Upload</button>
  <p id='status'></p>
  <div id='result' hidden>
    <p>Share link: <a id='link' href='#'></a></p>
    <p>Secret code: <code id='code'></code></p>
    <p><small>Send the link and the code separately. The code is shown only once.</small></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    $('send').onclick = async () => {
      const file = $('file').files[0];
      if (!file) return;
      const contentType = file.type || 'application/octet-stream';

      try {
        $('status').textContent = 'Requesting upload URL...';
        const res = await fetch('/api/uploads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, contentType, size: file.size }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        $('status').textContent = 'Uploading to S3...';
        const put = await fetch(data.uploadUrl, {
          method: 'PUT',
          headers: { 'Content-Type': contentType }, // must equal the signed type
          body: file,
        });
        if (!put.ok) throw new Error('S3 upload failed: ' + put.status);

        $('status').textContent = 'Done. Expires at ' + new Date(data.expiresAt).toLocaleString();
        $('link').textContent = data.shareUrl;
        $('link').href = data.shareUrl;
        $('code').textContent = data.code;
        $('result').hidden = false;
      } catch (err) {
        $('status').textContent = 'Error: ' + err.message;
      }
    };
  </script>
</body>
</html>
